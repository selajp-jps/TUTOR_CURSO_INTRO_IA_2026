name: Mantener despierta la app (keep-alive)

# Visita la app cada pocas horas con un navegador real (headless) para que
# Streamlit registre actividad y no la duerma tras 12 h de inactividad.

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas (hora UTC)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña "Actions"

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visitar la app para mantenerla despierta
        run: python .github/scripts/keepalive.py
